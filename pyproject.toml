[project]
name = "document-parsing"
version = "0.1.0"
description = "PDF parsing and evaluation for the RAG ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "pillow>=12",  # Nexus quarantines every Pillow below 12
    "pypdf>=5",
    "pypdfium2>=4.30",
    "pyyaml>=6",
    "fonttools>=4.60",  # pypdf's 'fonts' extra: decodes embedded fonts during text extraction
]

[project.optional-dependencies]
docling = ["docling[rapidocr,easyocr,tesserocr]>=2.153"]
annotation = ["docling-eval[cvat_tools]", "pyarrow"]  # `annotation prepare` and `collect` run docling-eval
gold = ["pyarrow"]  # `evaluation score` and `experiments log` read the ground truth
tracking = ["mlflow"]  # only `experiments log` sends results to MLflow

[project.scripts]
pipeline = "pipeline.cli:main"
evaluation = "evaluation.cli:main"
annotation = "annotation.cli:main"
experiments = "experiments.cli:main"

[dependency-groups]
dev = ["ipykernel>=6", "pytest>=8", "ruff>=0.6"]

[tool.uv]
# Nexus sometimes mirrors a release only in part (fonttools 4.69.0: Linux/macOS wheels, no Windows wheel or sdist).
# Lock only versions installable on both the Windows workstations and the Linux GPU box.
required-environments = [
    "sys_platform == 'win32' and platform_machine == 'AMD64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
]
# docling-cvat-tools (annotation extra) caps Pillow below 12, but Nexus quarantines those Pillow files (all Linux
# builds, most Windows ones). Its CVAT round trip (`annotation prepare` and `collect`) runs on Pillow 13.
override-dependencies = ["pillow>=12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsing", "src/pipeline", "src/visualizer", "src/evaluation", "src/inventory", "src/triage", "src/annotation", "src/experiments"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
