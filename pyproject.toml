[project]
name = "document-parsing"
version = "0.1.0"
description = "PDF parsing and evaluation for the RAG ingestion pipeline"
requires-python = ">=3.11"
dependencies = [
    "pillow>=10",
    "pypdf>=5",
    "pypdfium2>=4.30",
    "pyyaml>=6",
    "fonttools>=4.60",
]

[project.optional-dependencies]
docling = ["docling[rapidocr,easyocr,tesserocr]>=2.150"]
annotation = ["docling-eval[cvat_tools]", "pyarrow"]  # `annotation prepare` and `collect` run docling-eval
gold = ["pyarrow"]  # `evaluation score` reads the ground truth
tracking = ["mlflow"]  # only `experiments log` sends results to MLflow

[project.scripts]
parsing = "parsing.cli:main"
evaluation = "evaluation.cli:main"
annotation = "annotation.cli:main"
experiments = "experiments.cli:main"

[dependency-groups]
dev = ["ipykernel>=6", "pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parsing", "src/evaluation", "src/inventory", "src/triage", "src/annotation", "src/experiments"]

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
