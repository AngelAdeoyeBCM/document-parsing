name: docling_charts
input:
  directory: storage
  manifest: data/sample.txt
output: outputs/docling_charts
triage:
  classifiers: [rules, repetition]
parser:
  name: docling
  options:
    device: cuda:2
    heading_hierarchy: true
    classify_pictures: true
    extract_charts: true
